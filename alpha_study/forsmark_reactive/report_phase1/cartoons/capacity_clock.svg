<svg xmlns="http://www.w3.org/2000/svg" class="cartoon" viewBox="0 0 960 350" role="img" aria-label="Capacity-normalised time puts both chemistries on one clock. In pore volumes, gypsum-only water could have removed the whole inventory after about 7,300 PV and coupled brine after about 230 PV, 30 times sooner. Dividing by the inventory each pore volume can remove maps both to t_cap = 1, and the strongest channel comes at nearly the same capacity time in both (measured median PR_V minimum 0.37 gypsum-only, 0.46 coupled).">
