<figcaption>In open fractures the aperture sets both flow and volume, so the flow channel is the pore-space channel. In a vein network mid-dissolution the dissolved space sits upstream while the still-filled fractures downstream set the flow, so flow and pore space decouple (PR_pore falls while PR_V holds).</figcaption></figure>
<figure><h3>transport.svg</h3><svg class="cartoon" viewBox="0 0 960 346" role="img" aria-label="Why the breakthrough curve narrows. (a) In an open-fracture network a tracer pulse races through a fast channel that holds little volume while much of it lingers in slow side fractures: early peak, long tail. (b) After channelization in a vein network the dissolved channel holds most of the pore space and most of the flow, so the pulse moves as a near-plug and arrives close to the mean residence time.">
