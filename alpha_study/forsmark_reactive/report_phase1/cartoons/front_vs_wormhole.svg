<svg xmlns="http://www.w3.org/2000/svg" class="cartoon" viewBox="0 0 960 330" role="img" aria-label="Wormhole versus compact front. Left: in soluble rock with unbounded permeability gain a thin finger reaches the outlet after a few percent has dissolved. Right: in the fracture networks the front advances on many inherited paths at once and the outlet is reached only after about 53 to 67 percent of the gypsum has dissolved, because each fracture's gain is capped at x10 to x20 and 9 to 44 parallel paths share the flow over 1 km.">
